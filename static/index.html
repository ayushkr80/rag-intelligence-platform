<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document Intelligence Platform</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --border: #334155; --text: #e2e8f0;
    --muted: #94a3b8; --accent: #38bdf8; --user: #2563eb; --badge: #0ea5e9;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
  header h1 { font-size: 16px; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; }
  header select { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 13px; margin-left: auto; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 10px; line-height: 1.5; font-size: 14px; white-space: pre-wrap; }
  .user { align-self: flex-end; background: var(--user); }
  .assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .badge { display: inline-block; margin-top: 8px; font-size: 11px; color: var(--badge); border: 1px solid var(--badge); border-radius: 999px; padding: 1px 8px; }
  footer { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
  footer input { flex: 1; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 11px 14px; font-size: 14px; }
  footer button { background: var(--accent); color: #082f49; border: none; border-radius: 8px; padding: 0 20px; font-weight: 600; cursor: pointer; }
  footer button:disabled { opacity: 0.5; cursor: wait; }
  .hint { color: var(--muted); font-size: 12px; padding: 0 20px 8px; }
</style>
</head>
<body>
<header>
  <h1>Document Intelligence Platform</h1>
  <span class="sub">10-K filings: Apple · Microsoft · NVIDIA — hybrid retrieval, routed tools, cited answers</span>
  <select id="role">
    <option value="employee">employee</option>
    <option value="analyst">analyst</option>
  </select>
</header>
<div id="chat"></div>
<div class="hint">Try: "Which company grew its cloud or data center business fastest?" · "Which suppliers does NVIDIA depend on?" · "What does Apple's Summary Compensation Table show?"</div>
<footer>
  <input id="q" placeholder="Ask a question about the filings…" autocomplete="off">
  <button id="send">Send</button>
</footer>
<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("q");
  const send = document.getElementById("send");
  const role = document.getElementById("role");
  const history = [];

  function add(cls, text, meta) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    if (meta) {
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = meta;
      div.appendChild(document.createElement("br"));
      div.appendChild(badge);
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function ask() {
    const question = input.value.trim();
    if (!question) return;
    input.value = "";
    add("user", question);
    send.disabled = true;
    const pending = add("assistant", "…");
    try {
      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, role: role.value, history }),
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      pending.textContent = data.answer;
      const meta = `route: ${data.route}` +
        (data.duration_ms ? ` · ${(data.duration_ms / 1000).toFixed(1)}s` : "") +
        (data.cost_usd != null ? ` · ~$${data.cost_usd.toFixed(6)}` : "");
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = meta;
      pending.appendChild(document.createElement("br"));
      pending.appendChild(badge);
      history.push([question, data.answer]);
    } catch (err) {
      pending.textContent = "(error: " + err.message + " — try again)";
    } finally {
      send.disabled = false;
      input.focus();
    }
  }

  send.addEventListener("click", ask);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") ask(); });
  input.focus();
</script>
</body>
</html>
